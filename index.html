<script type="text/babel">
const { useState, useMemo, useRef } = React;

const C={bg:"#f0f4f8",card:"#fff",navy:"#0f172a",teal:"#0d9488",tealLight:"#e6faf8",tealMid:"#14b8a6",
  border:"#e2e8f0",muted:"#64748b",light:"#f8fafc",
  green:"#16a34a",greenBg:"#dcfce7",amber:"#b45309",amberBg:"#fef3c7",
  blue:"#1d4ed8",blueBg:"#dbeafe",red:"#dc2626",redBg:"#fee2e2",stripe:"#f8fafc"};

const TABS=[
  {id:"upload",  label:"Upload Data",          step:"①"},
  {id:"gstin",   label:"Reco by GST Number",   step:"②"},
  {id:"invoice", label:"Reco by GST + Invoice",step:"③"},
  {id:"3bcomp",  label:"3B ITC Check",         step:"④"},
  {id:"report",  label:"Summary Report",       step:"⑤"},
];
const ST={
  MATCHED:     {label:"Matched",    color:C.green,bg:C.greenBg,icon:"✓"},
  AMT_MISMATCH:{label:"Mismatch",   color:C.amber,bg:C.amberBg,icon:"≠"},
  IN_2B_ONLY:  {label:"In 2B Only", color:C.blue, bg:C.blueBg, icon:"↓"},
  IN_BOOKS_ONLY:{label:"Books Only",color:C.red,  bg:C.redBg,  icon:"↑"},
};
const MNAME=["","January","February","March","April","May","June","July","August","September","October","November","December"];

/* ─── Financial Year & Period helpers ─────────────────────────────────── */
const FY_OPTIONS=["FY 2024-25","FY 2025-26","FY 2026-27","FY 2027-28","FY 2028-29"];
const PERIOD_OPTIONS=[
  {value:"Q1",label:"Q1 (Apr – Jun)"},
  {value:"Q2",label:"Q2 (Jul – Sep)"},
  {value:"Q3",label:"Q3 (Oct – Dec)"},
  {value:"Q4",label:"Q4 (Jan – Mar)"},
  {value:"H1",label:"H1 (Apr – Sep)"},
  {value:"H2",label:"H2 (Oct – Mar)"},
  {value:"FULL",label:"Full Year (Apr – Mar)"},
];

function getPeriodMonths(fy, period){
  // fy like "FY 2025-26" → startYear=2025
  const startYear=parseInt((fy||"FY 2025-26").replace("FY ","").split("-")[0]);
  const all=[
    {m:4,y:startYear},{m:5,y:startYear},{m:6,y:startYear},
    {m:7,y:startYear},{m:8,y:startYear},{m:9,y:startYear},
    {m:10,y:startYear},{m:11,y:startYear},{m:12,y:startYear},
    {m:1,y:startYear+1},{m:2,y:startYear+1},{m:3,y:startYear+1},
  ];
  const slices={Q1:all.slice(0,3),Q2:all.slice(3,6),Q3:all.slice(6,9),Q4:all.slice(9,12),
    H1:all.slice(0,6),H2:all.slice(6,12),FULL:all};
  return (slices[period]||all).map(({m,y})=>({
    m,y,
    key:`${y}-${String(m).padStart(2,"0")}`,
    label:`${MNAME[m]} ${y}`,
    short:MNAME[m].slice(0,3)+" '"+String(y).slice(2),
  }));
}

function periodLabel(fy,period){
  const p=PERIOD_OPTIONS.find(o=>o.value===period);
  return `${p?p.label:period} · ${fy}`;
}

function dateMonthKey(dateStr){
  const s=normalizeDate(String(dateStr||""));
  const p=s.split("/");
  if(p.length<3) return null;
  const m=parseInt(p[1]),y=parseInt(p[2]);
  if(!m||!y) return null;
  return `${y}-${String(m).padStart(2,"0")}`;
}

/* ─── Formatting ──────────────────────────────────────────────────────── */
const fmt    = n=>new Intl.NumberFormat("en-IN",{maximumFractionDigits:0}).format(n||0);
const fmtC   = n=>"₹"+fmt(Math.abs(n));
const invKey = (g,i)=>`${(g||"").trim().toUpperCase()}|||${(i||"").trim().replace(/\s+/g,"").toUpperCase()}`;
const parseNum= v=>Math.abs(parseFloat(String(v||0).replace(/[,₹\s]/g,""))||0);

function normalizeDate(val){
  if(!val) return "";
  const s=String(val).trim();
  const m1=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m1) return `${m1[3]}/${m1[2]}/${m1[1]}`;
  const m2=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);
  if(m2) return `${m2[1].padStart(2,"0")}/${m2[2].padStart(2,"0")}/${m2[3]}`;
  return s;
}

/* ─── File Parsers ────────────────────────────────────────────────────── */
function parse2BSheet(aoa){
  const hi=aoa.findIndex(r=>r.some(c=>String(c||"").toLowerCase().includes("gstin of supplier")));
  if(hi===-1) return parseGeneric(aoa,"2b");
  return aoa.slice(hi+2).filter(r=>{
    const g=String(r[0]||"").trim();
    return g.length>=10&&!/total/i.test(g)&&String(r[2]||"").trim();
  }).map(r=>({
    gstin:String(r[0]||"").trim().toUpperCase(),name:String(r[1]||"").trim(),
    invNo:String(r[2]||"").trim(),invDate:normalizeDate(r[4]),
    taxable:parseNum(r[8]),igst:parseNum(r[9]),cgst:parseNum(r[10]),sgst:parseNum(r[11]),cess:parseNum(r[12]),
  }));
}
function parseTallySheet(aoa){
  const hi=aoa.findIndex(r=>{
    const s=r.map(c=>String(c||"").toLowerCase());
    return s.some(c=>c==="date")&&s.some(c=>c.includes("particulars"))&&s.some(c=>c.includes("gstin"));
  });
  if(hi===-1) return parseGeneric(aoa,"books");
  const hdr=aoa[hi].map(h=>String(h||""));
  const ci=(...kws)=>hdr.findIndex(h=>kws.some(kw=>h.toLowerCase().includes(kw.toLowerCase())));
  const dateIdx=ci("date"),nameIdx=ci("particulars"),vIdx=ci("voucher no"),gIdx=ci("gstin");
  const grossIdx=ci("gross total","gross"),cgstIdx=ci("cgst"),sgstIdx=ci("sgst"),igstIdx=ci("igst"),cessIdx=ci("cess");
  const taxSet=new Set([cgstIdx,sgstIdx,igstIdx,cessIdx].filter(x=>x!==-1));
  let txIdx=grossIdx+1;
  while(txIdx<hdr.length&&taxSet.has(txIdx)) txIdx++;
  if(txIdx>=hdr.length) txIdx=grossIdx;
  return aoa.slice(hi+1).filter(r=>{
    const g=String(r[gIdx]||"").trim(),n=String(r[nameIdx]||"").trim();
    return g.length>=5&&!/grand total|^total/i.test(n)&&String(r[vIdx]||"").trim();
  }).map(r=>({
    gstin:String(r[gIdx]||"").trim().toUpperCase(),name:String(r[nameIdx]||"").trim(),
    invNo:String(r[vIdx]||"").trim(),invDate:normalizeDate(r[dateIdx]),
    taxable:parseNum(r[txIdx]),
    igst:igstIdx!==-1?parseNum(r[igstIdx]):0,cgst:cgstIdx!==-1?parseNum(r[cgstIdx]):0,
    sgst:sgstIdx!==-1?parseNum(r[sgstIdx]):0,cess:cessIdx!==-1?parseNum(r[cessIdx]):0,
  }));
}
function parseGeneric(aoa,type){
  let hi=0;
  for(let i=0;i<Math.min(aoa.length,20);i++){if(aoa[i].filter(c=>String(c||"").trim()).length>=4){hi=i;break;}}
  const hdr=aoa[hi].map(h=>String(h||""));
  const ci=(...kws)=>hdr.findIndex(h=>kws.some(kw=>h.toLowerCase().includes(kw.toLowerCase())));
  if(type==="2b"){
    const gI=ci("gstin of supplier","gstin"),nI=ci("trade/legal","supplier name","name"),iI=ci("invoice number","invoice no"),dI=ci("invoice date","date");
    const tI=ci("taxable value","taxable amount"),igI=ci("integrated tax","igst"),cgI=ci("central tax","cgst"),sgI=ci("state/ut tax","state tax","sgst"),csI=ci("cess");
    return aoa.slice(hi+1).filter(r=>{const g=String(r[gI]||"").trim();return g.length>=10&&String(r[iI]||"").trim();})
      .map(r=>({gstin:String(r[gI]||"").trim().toUpperCase(),name:String(r[nI]||"").trim(),invNo:String(r[iI]||"").trim(),
        invDate:normalizeDate(r[dI]),taxable:parseNum(r[tI]),igst:parseNum(r[igI]),cgst:parseNum(r[cgI]),sgst:parseNum(r[sgI]),cess:csI!==-1?parseNum(r[csI]):0}));
  }
  const gI=ci("gstin","party gstin"),nI=ci("party name","particulars","ledger","name"),iI=ci("voucher no","invoice no","ref"),dI=ci("date");
  const tI=ci("taxable amount","taxable value","taxable"),igI=ci("igst","integrated"),cgI=ci("cgst","central"),sgI=ci("sgst","state"),csI=ci("cess");
  return aoa.slice(hi+1).filter(r=>{const g=String(r[gI]||"").trim();return g.length>=5&&!/total/i.test(String(r[nI]||""))&&String(r[iI]||"").trim();})
    .map(r=>({gstin:String(r[gI]||"").trim().toUpperCase(),name:String(r[nI]||"").trim(),invNo:String(r[iI]||"").trim(),
      invDate:normalizeDate(r[dI]),taxable:parseNum(r[tI]),igst:igI!==-1?parseNum(r[igI]):0,cgst:cgI!==-1?parseNum(r[cgI]):0,sgst:sgI!==-1?parseNum(r[sgI]):0,cess:csI!==-1?parseNum(r[csI]):0}));
}
function parseFile(file,type,onDone){
  const ext=file.name.split(".").pop().toLowerCase();
  const proc=aoa=>{onDone(type==="2b"?parse2BSheet(aoa):parseTallySheet(aoa),file.name);};
  if(ext==="csv"||ext==="txt"){Papa.parse(file,{header:false,skipEmptyLines:true,complete:({data})=>proc(data)});return;}
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const wb=XLSX.read(e.target.result,{type:"array"});
      const sn=type==="2b"?(wb.SheetNames.find(n=>n.trim().toUpperCase()==="B2B")||wb.SheetNames[0]):wb.SheetNames[0];
      proc(XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:""}));
    }catch(e){alert("Error: "+e.message);onDone([],file.name);}
  };
  reader.readAsArrayBuffer(file);
}

/* ─── Reconciliation ─────────────────────────────────────────────────── */
function reconByGSTIN(d2b,dBooks){
  const agg=arr=>{
    const m=new Map();
    arr.forEach(r=>{
      const k=r.gstin.trim().toUpperCase();if(!k) return;
      if(!m.has(k)) m.set(k,{gstin:k,name:r.name,taxable:0,igst:0,cgst:0,sgst:0,cess:0,invCount:0});
      const v=m.get(k);v.taxable+=r.taxable;v.igst+=r.igst;v.cgst+=r.cgst;v.sgst+=r.sgst;v.cess+=r.cess;v.invCount++;
    });
    return m;
  };
  const map2b=agg(d2b),mapBk=agg(dBooks);
  const results=[];
  new Set([...map2b.keys(),...mapBk.keys()]).forEach(gstin=>{
    const a=map2b.get(gstin),b=mapBk.get(gstin);
    if(!a){results.push({gstin,name:b.name,status:"IN_BOOKS_ONLY",igst2b:0,cgst2b:0,sgst2b:0,taxable2b:0,inv2b:0,igstBk:b.igst,cgstBk:b.cgst,sgstBk:b.sgst,taxableBk:b.taxable,invBk:b.invCount,diffIgst:-b.igst,diffCgst:-b.cgst,diffSgst:-b.sgst});return;}
    if(!b){results.push({gstin,name:a.name,status:"IN_2B_ONLY",igst2b:a.igst,cgst2b:a.cgst,sgst2b:a.sgst,taxable2b:a.taxable,inv2b:a.invCount,igstBk:0,cgstBk:0,sgstBk:0,taxableBk:0,invBk:0,diffIgst:a.igst,diffCgst:a.cgst,diffSgst:a.sgst});return;}
    const di=a.igst-b.igst,dc=a.cgst-b.cgst,ds=a.sgst-b.sgst;
    results.push({gstin,name:a.name,status:Math.abs(di)+Math.abs(dc)+Math.abs(ds)>0.49?"AMT_MISMATCH":"MATCHED",
      igst2b:a.igst,cgst2b:a.cgst,sgst2b:a.sgst,taxable2b:a.taxable,inv2b:a.invCount,
      igstBk:b.igst,cgstBk:b.cgst,sgstBk:b.sgst,taxableBk:b.taxable,invBk:b.invCount,diffIgst:di,diffCgst:dc,diffSgst:ds});
  });
  const order={AMT_MISMATCH:0,IN_2B_ONLY:1,IN_BOOKS_ONLY:2,MATCHED:3};
  const itcG=r=>r.igst2b+r.cgst2b+r.sgst2b+r.igstBk+r.cgstBk+r.sgstBk;
  return results.sort((a,b)=>{const sd=order[a.status]-order[b.status];return sd!==0?sd:itcG(b)-itcG(a);});
}
function reconByInvoice(d2b,dBooks){
  const res=[],bmap=new Map(),matched=new Set();
  dBooks.forEach(r=>bmap.set(invKey(r.gstin,r.invNo),r));
  d2b.forEach(r2b=>{
    const k=invKey(r2b.gstin,r2b.invNo);const bk=bmap.get(k);
    if(!bk){res.push({...r2b,status:"IN_2B_ONLY",bookEntry:null,diff:null});}
    else{
      matched.add(k);
      const diff={igst:r2b.igst-bk.igst,cgst:r2b.cgst-bk.cgst,sgst:r2b.sgst-bk.sgst,cess:r2b.cess-bk.cess};
      res.push({...r2b,bookEntry:bk,status:Object.values(diff).some(d=>Math.abs(d)>0.49)?"AMT_MISMATCH":"MATCHED",diff});
    }
  });
  dBooks.forEach(r=>{if(!matched.has(invKey(r.gstin,r.invNo)))res.push({...r,status:"IN_BOOKS_ONLY",bookEntry:null,diff:null});});
  const order={AMT_MISMATCH:0,IN_2B_ONLY:1,IN_BOOKS_ONLY:2,MATCHED:3};
  const itc=r=>r.igst+r.cgst+r.sgst+r.cess;
  return res.sort((a,b)=>{const sd=order[a.status]-order[b.status];return sd!==0?sd:itc(b)-itc(a);});
}

/* ─── Multi-File Upload Card ─────────────────────────────────────────── */
function MultiUploadCard({title,hint,note,files,onFiles,onRemove,type}){
  const ref=useRef();
  const [drag,setDrag]=useState(false);
  const total=files.reduce((s,f)=>s+f.count,0);const has=files.length>0;
  const tpl=type==="2b"
    ?`GSTIN of supplier,Trade/Legal name,Invoice number,Invoice type,Invoice Date,Invoice Value,Place of supply,Reverse Charge,Taxable value,Integrated Tax,Central Tax,State/UT tax,Cess\n06AADCM5146R1ZZ,Sample Supplier,INV-001,Regular,01-04-2025,11800,07-DELHI,N,10000,1800,0,0,0`
    :`Date,Particulars,Voucher Type,Voucher No.,GSTIN/UIN,Gross Total,Taxable Ledger,CGST Amount,SGST Amount\n2025-04-01,Sample Party,Purchase,PUR-001,07AAACL2108F1Z2,11800,10000,450,450`;
  const dl=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([tpl],{type:"text/csv"}));a.download=type==="2b"?"GSTR2B_Template.csv":"Tally_Template.csv";a.click();};
  return<div style={{border:`2px dashed ${drag?C.teal:has?C.tealMid:C.border}`,borderRadius:14,background:has?C.tealLight:drag?"#f0fdf4":C.card,transition:"all .2s",overflow:"hidden"}}>
    <div style={{padding:"14px 18px",borderBottom:`1px solid ${has?C.teal+"30":C.border}`}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <div style={{width:36,height:36,borderRadius:8,background:has?C.teal:C.border,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,transition:"all .2s"}}>{has?"✓":"📂"}</div>
        <div style={{flex:1}}>
          <div style={{fontWeight:700,fontSize:14,color:C.navy}}>{title}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:1}}>{hint}</div>
        </div>
        {has&&<div style={{fontSize:12,fontWeight:700,color:C.teal,background:"#fff",padding:"3px 10px",borderRadius:99,border:`1px solid ${C.teal}30`}}>{total} records</div>}
      </div>
    </div>
    <div onDragOver={e=>{e.preventDefault();setDrag(true)}} onDragLeave={()=>setDrag(false)}
      onDrop={e=>{e.preventDefault();setDrag(false);onFiles(e.dataTransfer.files,type)}} style={{padding:"12px 18px"}}>
      <input ref={ref} type="file" accept=".csv,.xlsx,.xls" multiple style={{display:"none"}}
        onChange={e=>{if(e.target.files.length)onFiles(e.target.files,type);e.target.value="";}}/>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:has?10:0}}>
        <button onClick={()=>ref.current.click()} style={{padding:"7px 14px",borderRadius:7,border:"none",cursor:"pointer",fontSize:12.5,background:has?C.teal:C.navy,color:"#fff",fontWeight:600}}>
          {has?"+ Add More":"↑ Upload Files"}
        </button>
        <button onClick={dl} style={{padding:"7px 12px",borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",fontSize:11.5,background:"#fff",color:C.muted,fontWeight:500}}>↓ Template</button>
      </div>
      {!has&&<div style={{fontSize:11.5,color:C.muted,padding:"8px 10px",marginTop:8,background:C.light,borderRadius:7,border:`1px dashed ${C.border}`}}>
        🗂 Drag & drop or click Upload · CSV, XLSX, XLS · Multiple files OK
      </div>}
      {!has&&note&&<div style={{marginTop:8,padding:"8px 12px",background:"#fffbeb",borderRadius:7,border:`1px solid ${C.amber}30`,fontSize:11,color:C.muted}}>
        <span style={{fontWeight:700,color:C.amber}}>📌 </span>{note}
      </div>}
      {has&&<div style={{display:"flex",flexDirection:"column",gap:5}}>
        {files.map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",background:"#fff",borderRadius:7,border:`1px solid ${C.teal}20`}}>
          <span style={{fontSize:13}}>📄</span>
          <span style={{flex:1,fontSize:12,fontWeight:600,color:C.navy,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={f.name}>{f.name}</span>
          <span style={{fontSize:11,color:C.teal,fontWeight:700,flexShrink:0}}>{f.count} rec</span>
          <button onClick={()=>onRemove(f.id,type)} style={{width:18,height:18,borderRadius:99,border:"none",cursor:"pointer",background:C.redBg,color:C.red,fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,flexShrink:0}}>×</button>
        </div>)}
      </div>}
    </div>
  </div>;
}

/* ─── Main App ──────────────────────────────────────────────────────── */
function GSTRecon(){
  const [tabIdx,setTabIdx]=useState(0);
  const tab=TABS[tabIdx].id;

  // Period selectors
  const [fy,setFy]=useState("FY 2025-26");
  const [period,setPeriod]=useState("Q1");

  const [files2b,setFiles2b]=useState([]);
  const [filesBooks,setFilesBooks]=useState([]);
  // data3b keyed by "YYYY-MM"
  const [data3b,setData3b]=useState({});
  const [filterG,setFilterG]=useState("ALL");
  const [filterI,setFilterI]=useState("ALL");
  const [expandedGST,setExpandedGST]=useState(new Set());
  const [companyName,setCompanyName]=useState("Your Company Pvt Ltd");
  const [gstinNo,setGstinNo]=useState("27XXXXX0000X1ZX");
  const [parseLog,setParseLog]=useState([]);

  // Derived period months
  const periodMonths=useMemo(()=>getPeriodMonths(fy,period),[fy,period]);
  const pLabel=useMemo(()=>periodLabel(fy,period),[fy,period]);
  const fileName=useMemo(()=>`${fy.replace("FY ","FY").replace("-","")}_${period}`,[fy,period]);

  // Merged data (all uploaded files, no date filter — user uploads relevant period files)
  const data2b   =useMemo(()=>files2b.flatMap(f=>f.records),   [files2b]);
  const dataBooks=useMemo(()=>filesBooks.flatMap(f=>f.records), [filesBooks]);

  // Filter data to selected period
  const data2bPeriod   =useMemo(()=>{
    const keys=new Set(periodMonths.map(p=>p.key));
    return data2b.filter(r=>{const k=dateMonthKey(r.invDate);return !k||keys.has(k);});
  },[data2b,periodMonths]);
  const dataBooksPeriod=useMemo(()=>{
    const keys=new Set(periodMonths.map(p=>p.key));
    return dataBooks.filter(r=>{const k=dateMonthKey(r.invDate);return !k||keys.has(k);});
  },[dataBooks,periodMonths]);

  const canProceed=data2b.length>0&&dataBooks.length>0;

  const handleFiles=(fileList,type)=>{
    Array.from(fileList).forEach(file=>{
      parseFile(file,type,(records,fname)=>{
        const entry={id:Date.now()+Math.random(),name:fname,count:records.length,records};
        if(type==="2b") setFiles2b(p=>[...p,entry]);
        else setFilesBooks(p=>[...p,entry]);
        setParseLog(p=>[`✓ ${fname}: ${records.length} records`,...p]);
      });
    });
  };
  const removeFile=(id,type)=>{
    if(type==="2b") setFiles2b(p=>p.filter(f=>f.id!==id));
    else setFilesBooks(p=>p.filter(f=>f.id!==id));
  };

  // Reconciliation on period-filtered data
  const gstinReco=useMemo(()=>canProceed?reconByGSTIN(data2bPeriod,dataBooksPeriod):[],[data2bPeriod,dataBooksPeriod,canProceed]);
  const gstinCounts=useMemo(()=>{const c={MATCHED:0,AMT_MISMATCH:0,IN_2B_ONLY:0,IN_BOOKS_ONLY:0};gstinReco.forEach(r=>c[r.status]++);return c;},[gstinReco]);
  const filteredG=useMemo(()=>filterG==="ALL"?gstinReco:gstinReco.filter(r=>r.status===filterG),[gstinReco,filterG]);

  const invReco=useMemo(()=>canProceed?reconByInvoice(data2bPeriod,dataBooksPeriod):[],[data2bPeriod,dataBooksPeriod,canProceed]);
  const invCounts=useMemo(()=>{const c={MATCHED:0,AMT_MISMATCH:0,IN_2B_ONLY:0,IN_BOOKS_ONLY:0};invReco.forEach(r=>c[r.status]++);return c;},[invReco]);
  const filteredI=useMemo(()=>filterI==="ALL"?invReco:invReco.filter(r=>r.status===filterI),[invReco,filterI]);

  const totalITC2b   =useMemo(()=>data2bPeriod.reduce((s,r)=>s+r.igst+r.cgst+r.sgst+r.cess,0),[data2bPeriod]);
  const totalITCBooks=useMemo(()=>dataBooksPeriod.reduce((s,r)=>s+r.igst+r.cgst+r.sgst+r.cess,0),[dataBooksPeriod]);

  // 3B comparison — dynamic months from periodMonths
  const get3b=key=>data3b[key]||{igst:"",cgst:"",sgst:"",cess:""};
  const set3b=(key,field,val)=>setData3b(d=>({...d,[key]:{...get3b(key),[field]:val}}));

  const itcComp=useMemo(()=>{
    if(!data2bPeriod.length) return [];
    return periodMonths.map(pm=>{
      const rows=data2bPeriod.filter(r=>dateMonthKey(r.invDate)===pm.key);
      const igst2b=rows.reduce((s,r)=>s+r.igst,0),cgst2b=rows.reduce((s,r)=>s+r.cgst,0);
      const sgst2b=rows.reduce((s,r)=>s+r.sgst,0),cess2b=rows.reduce((s,r)=>s+r.cess,0);
      const t3=get3b(pm.key);
      const igst3b=parseNum(t3.igst),cgst3b=parseNum(t3.cgst),sgst3b=parseNum(t3.sgst),cess3b=parseNum(t3.cess);
      return{...pm,igst2b,cgst2b,sgst2b,cess2b,tot2b:igst2b+cgst2b+sgst2b+cess2b,
        igst3b,cgst3b,sgst3b,cess3b,tot3b:igst3b+cgst3b+sgst3b+cess3b,
        diff:(igst3b+cgst3b+sgst3b+cess3b)-(igst2b+cgst2b+sgst2b+cess2b)};
    });
  },[data2bPeriod,periodMonths,data3b]);

  // Exports
  const dlCSV=(data,name)=>{
    const csv=data.map(r=>r.map(c=>`"${c}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click();
  };
  const exportGSTIN=()=>{
    const hdr=["Status","GSTIN","Supplier","Invoices(2B)","Taxable(2B)","IGST(2B)","CGST(2B)","SGST(2B)","Invoices(Books)","Taxable(Books)","IGST(Books)","CGST(Books)","SGST(Books)","IGST Diff","CGST Diff","SGST Diff"];
    const sorted=[...gstinReco].sort((a,b)=>(b.igst2b+b.cgst2b+b.sgst2b)-(a.igst2b+a.cgst2b+a.sgst2b));
    dlCSV([hdr,...sorted.map(r=>[ST[r.status].label,r.gstin,r.name,r.inv2b,r.taxable2b,r.igst2b,r.cgst2b,r.sgst2b,r.invBk,r.taxableBk,r.igstBk,r.cgstBk,r.sgstBk,r.diffIgst,r.diffCgst,r.diffSgst])],
      `GST_Reco_GSTIN_${fileName}.csv`);
  };
  const exportInvoice=()=>{
    const hdr=["Status","GSTIN","Supplier","Invoice No","Date","Taxable","IGST(2B)","CGST(2B)","SGST(2B)","IGST(Books)","CGST(Books)","SGST(Books)","IGST Diff","CGST Diff","SGST Diff"];
    const sorted=[...invReco].sort((a,b)=>(b.igst+b.cgst+b.sgst+b.cess)-(a.igst+a.cgst+a.sgst+a.cess));
    dlCSV([hdr,...sorted.map(r=>[ST[r.status].label,r.gstin,r.name,r.invNo,r.invDate,r.taxable,r.igst,r.cgst,r.sgst,
      r.bookEntry?r.bookEntry.igst:"",r.bookEntry?r.bookEntry.cgst:"",r.bookEntry?r.bookEntry.sgst:"",
      r.diff?r.diff.igst:"",r.diff?r.diff.cgst:"",r.diff?r.diff.sgst:""])],
      `GST_Reco_Invoice_${fileName}.csv`);
  };

  const goBack=()=>setTabIdx(i=>Math.max(0,i-1));
  const goNext=()=>setTabIdx(i=>Math.min(TABS.length-1,i+1));
  const toggleGST=g=>setExpandedGST(s=>{const n=new Set(s);n.has(g)?n.delete(g):n.add(g);return n;});
  const invByGSTIN=gstin=>invReco.filter(r=>r.gstin.toUpperCase()===gstin.toUpperCase());

  /* Shared UI pieces */
  const NavBar=()=>(
    <div style={{background:"#fff",borderBottom:`1px solid ${C.border}`,padding:"0 20px",display:"flex",alignItems:"center",gap:2,overflowX:"auto"}}>
      <button onClick={goBack} disabled={tabIdx===0} style={{padding:"8px 12px",border:`1px solid ${C.border}`,borderRadius:7,cursor:tabIdx===0?"not-allowed":"pointer",
        background:"#fff",color:tabIdx===0?C.border:C.navy,fontSize:12,fontWeight:700,fontFamily:"inherit",flexShrink:0,marginRight:4,opacity:tabIdx===0?.3:1}}>← Back</button>
      {TABS.map((t,i)=>(
        <button key={t.id} onClick={()=>setTabIdx(i)} style={{padding:"12px 13px",border:"none",background:"none",cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:600,
          whiteSpace:"nowrap",color:tabIdx===i?C.teal:C.muted,borderBottom:tabIdx===i?`2px solid ${C.teal}`:"2px solid transparent",transition:"all .15s",display:"flex",alignItems:"center",gap:4}}>
          <span style={{width:18,height:18,borderRadius:99,background:tabIdx===i?C.teal:i<tabIdx?C.green:C.border,color:"#fff",fontSize:9,fontWeight:800,
            display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{i<tabIdx?"✓":t.step}</span>
          {t.label}
        </button>
      ))}
      <button onClick={goNext} disabled={tabIdx===TABS.length-1} style={{marginLeft:"auto",padding:"8px 14px",border:"none",borderRadius:7,cursor:tabIdx===TABS.length-1?"not-allowed":"pointer",
        background:tabIdx===TABS.length-1?C.border:C.teal,color:"#fff",fontSize:12,fontWeight:700,fontFamily:"inherit",flexShrink:0,opacity:tabIdx===TABS.length-1?.3:1}}>Next →</button>
    </div>
  );
  const BotNav=()=>(
    <div style={{display:"flex",justifyContent:"space-between",marginTop:28,paddingTop:20,borderTop:`1px solid ${C.border}`}}>
      <button onClick={goBack} disabled={tabIdx===0} style={{padding:"9px 20px",border:`1px solid ${C.border}`,borderRadius:8,cursor:tabIdx===0?"not-allowed":"pointer",
        background:"#fff",color:tabIdx===0?C.border:C.navy,fontWeight:600,fontSize:13,fontFamily:"inherit",opacity:tabIdx===0?.3:1}}>← Back</button>
      {tabIdx<TABS.length-1&&<button onClick={goNext} style={{padding:"9px 22px",border:"none",borderRadius:8,cursor:"pointer",background:C.teal,color:"#fff",fontWeight:700,fontSize:13,fontFamily:"inherit"}}>
        {TABS[tabIdx+1].step} {TABS[tabIdx+1].label} →</button>}
    </div>
  );
  const Empty=({msg})=>(
    <div style={{textAlign:"center",padding:60,color:C.muted}}>
      <div style={{fontSize:36,marginBottom:12}}>📂</div>
      <div style={{fontWeight:600,marginBottom:14}}>{msg}</div>
      <button onClick={()=>setTabIdx(0)} style={{padding:"8px 20px",borderRadius:8,border:"none",cursor:"pointer",background:C.teal,color:"#fff",fontWeight:600,fontFamily:"inherit"}}>← Go to Upload</button>
    </div>
  );
  const FilterBar=({filter,setFilter,counts,onExport})=>(
    <div style={{display:"flex",gap:7,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      <span style={{fontSize:12,color:C.muted,fontWeight:600}}>Filter:</span>
      {["ALL","MATCHED","AMT_MISMATCH","IN_2B_ONLY","IN_BOOKS_ONLY"].map(s=>{
        const info=s==="ALL"?{label:"All",color:C.navy,bg:"#e2e8f0"}:ST[s];
        return<button key={s} onClick={()=>setFilter(s)} style={{padding:"5px 12px",borderRadius:99,border:`1.5px solid ${filter===s?info.color:C.border}`,
          cursor:"pointer",fontFamily:"inherit",fontSize:11.5,fontWeight:600,background:filter===s?info.bg:"#fff",color:filter===s?info.color:C.muted}}>
          {info.label} {s!=="ALL"&&`(${counts[s]||0})`}</button>;
      })}
      <button onClick={onExport} style={{marginLeft:"auto",padding:"6px 14px",borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:600,background:"#fff",color:C.navy}}>↓ Export CSV</button>
    </div>
  );

  /* ── RENDER ── */
  return<div style={{fontFamily:"'Plus Jakarta Sans',sans-serif",background:C.bg,minHeight:"100vh"}}>

    {/* ── Header ── */}
    <div style={{background:C.navy,color:"#fff",padding:"12px 24px",display:"flex",alignItems:"center",
      justifyContent:"space-between",flexWrap:"wrap",gap:10,borderBottom:"3px solid "+C.teal}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <div style={{width:38,height:38,borderRadius:9,background:C.teal,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>⚖</div>
        <div>
          <div style={{fontWeight:800,fontSize:16,letterSpacing:"-.02em"}}>GST Reconciliation Tool</div>
          <div style={{fontSize:11,color:"#94a3b8"}}>GSTR-2B vs Purchase Register vs GSTR-3B</div>
        </div>
      </div>

      {/* Period Selectors */}
      <div style={{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,background:"#1e293b",padding:"6px 10px",borderRadius:8,border:"1px solid #334155"}}>
          <span style={{fontSize:11,color:"#94a3b8",fontWeight:600,flexShrink:0}}>Financial Year</span>
          <Sel value={fy} onChange={v=>{setFy(v);setExpandedGST(new Set());}}>
            {FY_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}
          </Sel>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:6,background:"#1e293b",padding:"6px 10px",borderRadius:8,border:"1px solid #334155"}}>
          <span style={{fontSize:11,color:"#94a3b8",fontWeight:600,flexShrink:0}}>Period</span>
          <Sel value={period} onChange={v=>{setPeriod(v);setExpandedGST(new Set());}}>
            {PERIOD_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
          </Sel>
        </div>
        <input value={companyName} onChange={e=>setCompanyName(e.target.value)}
          style={{padding:"6px 10px",borderRadius:7,border:"1px solid #334155",background:"#1e293b",color:"#e2e8f0",fontSize:12,width:180}}/>
        <input value={gstinNo} onChange={e=>setGstinNo(e.target.value)}
          style={{padding:"6px 10px",borderRadius:7,border:"1px solid #334155",background:"#1e293b",color:"#94a3b8",fontSize:12,fontFamily:"monospace",width:160}}/>
      </div>
    </div>

    {/* Period Breadcrumb */}
    <div style={{background:"#1e293b",padding:"6px 24px",fontSize:12,color:"#94a3b8",display:"flex",alignItems:"center",gap:6}}>
      <span>📅</span>
      <span style={{fontWeight:700,color:C.tealMid}}>{pLabel}</span>
      {canProceed&&<span style={{marginLeft:8}}>·
        <span style={{color:C.tealMid,fontWeight:600}}> {data2bPeriod.length}</span> 2B invoices ·
        <span style={{color:C.tealMid,fontWeight:600}}> {dataBooksPeriod.length}</span> Book entries in this period
      </span>}
      {data2b.length>0&&data2bPeriod.length<data2b.length&&(
        <span style={{marginLeft:4,color:"#f59e0b",fontSize:11}}>({data2b.length-data2bPeriod.length} records outside period filtered out)</span>
      )}
    </div>

    <NavBar/>

    <div style={{maxWidth:1280,margin:"0 auto",padding:"22px 20px"}} className="fade">

    {/* ════════════════════ ① UPLOAD ════════════════════ */}
    {tab==="upload"&&<div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{fontWeight:800,fontSize:19}}>Upload Source Data</div>
          <div style={{color:C.muted,fontSize:13,marginTop:3}}>Upload Tally & GSTR-2B files · Period: <strong>{pLabel}</strong></div>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(290px,1fr))",gap:16,marginBottom:18}}>
        <MultiUploadCard title="GSTR-2B / GSTR-2A Files" hint="GST Portal export · B2B sheet auto-detected · CSV or Excel"
          note="GST Portal → Services → Returns → GSTR-2B → View → Download. B2B sheet is read automatically."
          type="2b" files={files2b} onFiles={handleFiles} onRemove={removeFile}/>
        <MultiUploadCard title="Tally Purchase Register" hint="Tally exported register · Headers auto-detected · CSV or Excel"
          note="Tally → Gateway → Display More Reports → Account Books → Purchase Register → Set period → Alt+E → Export"
          type="books" files={filesBooks} onFiles={handleFiles} onRemove={removeFile}/>
      </div>
      {parseLog.length>0&&<div style={{marginBottom:14,padding:"10px 14px",background:C.greenBg,borderRadius:9,border:`1px solid ${C.green}40`,fontSize:12,color:C.green,fontWeight:600}}>
        {parseLog.slice(0,5).map((l,i)=><div key={i}>{l}</div>)}
      </div>}

      {/* GSTR-3B — dynamic rows from periodMonths */}
      <div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden",marginBottom:18}}>
        <div style={{padding:"12px 18px",borderBottom:`1px solid ${C.border}`,background:C.light,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:17}}>📋</span>
            <div>
              <div style={{fontWeight:700,fontSize:14}}>GSTR-3B — ITC Claimed (Table 4A)</div>
              <div style={{fontSize:11,color:C.muted}}>Enter ITC as filed for each month in <strong>{pLabel}</strong></div>
            </div>
          </div>
          <div style={{fontSize:11,color:C.muted,background:"#f1f5f9",padding:"3px 10px",borderRadius:6}}>
            {periodMonths.length} month{periodMonths.length!==1?"s":""} · {fy}
          </div>
        </div>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
            <thead><tr style={{background:"#f1f5f9"}}>
              <th style={{padding:"8px 16px",textAlign:"left",fontWeight:600,color:C.muted}}>Month</th>
              {["IGST (₹)","CGST (₹)","SGST (₹)","CESS (₹)"].map(h=><th key={h} style={{padding:"8px 16px",textAlign:"right",fontWeight:600,color:C.muted}}>{h}</th>)}
              <th style={{padding:"8px 16px",textAlign:"right",fontWeight:600,color:C.navy}}>Total ITC</th>
            </tr></thead>
            <tbody>
              {periodMonths.map(pm=>{
                const row=get3b(pm.key);
                const total=parseNum(row.igst)+parseNum(row.cgst)+parseNum(row.sgst)+parseNum(row.cess);
                return<tr key={pm.key} style={{borderTop:`1px solid ${C.border}`}}>
                  <td style={{padding:"8px 16px",fontWeight:600}}>{pm.label}</td>
                  {["igst","cgst","sgst","cess"].map(f=>(
                    <td key={f} style={{padding:"5px 14px",textAlign:"right"}}>
                      <input type="number" value={row[f]} placeholder="0"
                        onChange={e=>set3b(pm.key,f,e.target.value)}
                        style={{width:100,padding:"5px 8px",borderRadius:6,border:`1px solid ${C.border}`,textAlign:"right",fontSize:12,fontFamily:"monospace",background:C.light}}/>
                    </td>
                  ))}
                  <td style={{padding:"8px 16px",textAlign:"right",fontWeight:700,color:C.navy}}>{total>0?fmtC(total):"—"}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
      </div>

      {canProceed
        ?<div style={{padding:14,borderRadius:10,background:C.tealLight,border:`1px solid ${C.teal}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
          <div style={{color:C.teal,fontWeight:600,fontSize:13}}>
            ✓ <strong>{data2bPeriod.length}</strong> 2B records · <strong>{dataBooksPeriod.length}</strong> Book records in <strong>{pLabel}</strong>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setTabIdx(1)} style={{padding:"8px 16px",borderRadius:8,border:`1px solid ${C.teal}`,cursor:"pointer",background:"#fff",color:C.teal,fontWeight:700,fontSize:12,fontFamily:"inherit"}}>② GSTIN Reco →</button>
            <button onClick={()=>setTabIdx(2)} style={{padding:"8px 16px",borderRadius:8,border:"none",cursor:"pointer",background:C.teal,color:"#fff",fontWeight:700,fontSize:12,fontFamily:"inherit"}}>③ Invoice Reco →</button>
          </div>
        </div>
        :<div style={{padding:12,borderRadius:9,background:C.light,border:`1px solid ${C.border}`,fontSize:13,color:C.muted,textAlign:"center"}}>
          Upload both GSTR-2B and Purchase Register files to begin reconciliation
        </div>
      }
      <BotNav/>
    </div>}

    {/* ════════════════════ ② RECO BY GSTIN ════════════════════ */}
    {tab==="gstin"&&(!canProceed
      ?<Empty msg="Please upload both files in Step ① first"/>
      :<div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontWeight:800,fontSize:19}}>Reconciliation by GST Number</div>
            <div style={{color:C.muted,fontSize:13,marginTop:3}}>{pLabel} · {gstinReco.length} unique GSTINs · Click any row to see invoices</div>
          </div>
        </div>
        <div style={{display:"flex",gap:12,marginBottom:18,flexWrap:"wrap"}}>
          <StatCard label="Matched GSTINs"  value={gstinCounts.MATCHED}      color={C.green} bg={C.greenBg} sub={`${Math.round(gstinCounts.MATCHED/(gstinReco.length||1)*100)}% match rate`}/>
          <StatCard label="Amt Mismatch"    value={gstinCounts.AMT_MISMATCH} color={C.amber} bg={C.amberBg} sub="Tax total differs"/>
          <StatCard label="In 2B Only"      value={gstinCounts.IN_2B_ONLY}   color={C.blue}  bg={C.blueBg}  sub="Not in Tally"/>
          <StatCard label="Books Only"      value={gstinCounts.IN_BOOKS_ONLY}color={C.red}   bg={C.redBg}   sub="Not in 2B"/>
          <StatCard label="2B Total ITC"    value={fmtC(totalITC2b)}         color={C.teal}/>
          <StatCard label="Books Total ITC" value={fmtC(totalITCBooks)}      color={C.navy}
            sub={Math.abs(totalITC2b-totalITCBooks)>0.5?`Diff: ₹${fmt(Math.abs(totalITC2b-totalITCBooks))}`:"✓ Match"}/>
        </div>
        <FilterBar filter={filterG} setFilter={setFilterG} counts={gstinCounts} onExport={exportGSTIN}/>
        <div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",minWidth:1100}}>
            <thead><tr style={{background:"#f1f5f9"}}>
              {["Status","Supplier Name","GSTIN","Inv(2B)","Taxable(2B)","IGST(2B)","CGST(2B)","SGST(2B)","Inv(Books)","Taxable(Books)","IGST(Books)","CGST(Books)","SGST(Books)","IGST Diff","CGST Diff","SGST Diff",""].map((h,i)=>(
                <th key={i} style={{padding:"8px 10px",textAlign:i>=3?"right":"left",fontWeight:600,color:C.muted,whiteSpace:"nowrap",borderBottom:`1px solid ${C.border}`,fontSize:11.5}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filteredG.length===0&&<tr><td colSpan={17} style={{textAlign:"center",padding:40,color:C.muted}}>No records</td></tr>}
              {filteredG.map((r,i)=>{
                const isOpen=expandedGST.has(r.gstin);
                const invs=invByGSTIN(r.gstin);
                const cell=(v,right,bold,muted,color)=>
                  <td style={{padding:"7px 10px",textAlign:right?"right":"left",fontWeight:bold?700:400,fontSize:12,color:color||(muted?C.muted:"inherit"),whiteSpace:"nowrap"}}>{v}</td>;
                const diff=(v,pos,neg)=>
                  <td style={{padding:"7px 10px",textAlign:"right",fontWeight:700,fontSize:12,color:v>0?pos:v<0?neg:C.green}}>{v!==0?(v>0?"+":"")+fmtC(v):"—"}</td>;
                return<React.Fragment key={r.gstin}>
                  <tr className="expandable" onClick={()=>toggleGST(r.gstin)}
                    style={{borderTop:`1px solid ${C.border}`,background:isOpen?"#f0fdf4":i%2===0?"#fff":C.stripe,transition:"background .1s"}}>
                    <td style={{padding:"7px 10px"}}><Badge status={r.status}/></td>
                    {cell(r.name||"—",false,true)}
                    <td style={{padding:"7px 10px",fontFamily:"monospace",fontSize:10.5,color:C.muted}}>{r.gstin}</td>
                    {cell(r.inv2b||"—",true)}{cell(r.taxable2b?fmtC(r.taxable2b):"—",true)}
                    {cell(r.igst2b?fmtC(r.igst2b):"—",true)}{cell(r.cgst2b?fmtC(r.cgst2b):"—",true)}{cell(r.sgst2b?fmtC(r.sgst2b):"—",true)}
                    {cell(r.invBk||"—",true,false,true)}{cell(r.taxableBk?fmtC(r.taxableBk):"—",true,false,true)}
                    {cell(r.igstBk?fmtC(r.igstBk):"—",true,false,true)}{cell(r.cgstBk?fmtC(r.cgstBk):"—",true,false,true)}{cell(r.sgstBk?fmtC(r.sgstBk):"—",true,false,true)}
                    {diff(r.diffIgst,C.amber,C.red)}{diff(r.diffCgst,C.amber,C.red)}{diff(r.diffSgst,C.amber,C.red)}
                    <td style={{padding:"7px 10px",textAlign:"center",fontSize:12,color:C.teal,fontWeight:700}}>{isOpen?"▲":"▼"}</td>
                  </tr>
                  {isOpen&&<tr><td colSpan={17} style={{padding:0,background:"#f0fdf4",borderTop:`1px solid ${C.teal}20`}}>
                    <div style={{padding:"10px 14px 14px 38px"}}>
                      <div style={{fontSize:12,fontWeight:700,color:C.teal,marginBottom:8}}>📋 Invoice Breakup — {r.gstin} ({invs.length} invoices)</div>
                      <div style={{overflowX:"auto",borderRadius:8,border:`1px solid ${C.teal}20`,background:"#fff"}}>
                        <table style={{width:"100%",borderCollapse:"collapse",fontSize:11.5,minWidth:700}}>
                          <thead><tr style={{background:"#f8fafc"}}>
                            {["Status","Invoice No","Date","Taxable","IGST(2B)","CGST(2B)","SGST(2B)","IGST(Books)","CGST(Books)","SGST(Books)","Variance"].map(h=>(
                              <th key={h} style={{padding:"6px 9px",textAlign:["Taxable","IGST(2B)","CGST(2B)","SGST(2B)","IGST(Books)","CGST(Books)","SGST(Books)","Variance"].includes(h)?"right":"left",
                                fontWeight:600,color:C.muted,borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{h}</th>
                            ))}
                          </tr></thead>
                          <tbody>
                            {invs.map((inv,j)=>{
                              const td=inv.diff?inv.diff.igst+inv.diff.cgst+inv.diff.sgst+inv.diff.cess:0;
                              return<tr key={j} style={{borderTop:`1px solid ${C.border}`,background:j%2?"#fafafa":"#fff"}}>
                                <td style={{padding:"5px 9px"}}><Badge status={inv.status} small/></td>
                                <td style={{padding:"5px 9px",fontWeight:600}}>{inv.invNo}</td>
                                <td style={{padding:"5px 9px",color:C.muted}}>{inv.invDate}</td>
                                <td style={{padding:"5px 9px",textAlign:"right"}}>₹{fmt(inv.taxable)}</td>
                                <td style={{padding:"5px 9px",textAlign:"right"}}>{inv.igst?`₹${fmt(inv.igst)}`:"—"}</td>
                                <td style={{padding:"5px 9px",textAlign:"right"}}>{inv.cgst?`₹${fmt(inv.cgst)}`:"—"}</td>
                                <td style={{padding:"5px 9px",textAlign:"right"}}>{inv.sgst?`₹${fmt(inv.sgst)}`:"—"}</td>
                                <td style={{padding:"5px 9px",textAlign:"right",color:C.muted}}>{inv.bookEntry?(inv.bookEntry.igst?`₹${fmt(inv.bookEntry.igst)}`:"—"):<span style={{color:C.red}}>N/A</span>}</td>
                                <td style={{padding:"5px 9px",textAlign:"right",color:C.muted}}>{inv.bookEntry?(inv.bookEntry.cgst?`₹${fmt(inv.bookEntry.cgst)}`:"—"):<span style={{color:C.red}}>N/A</span>}</td>
                                <td style={{padding:"5px 9px",textAlign:"right",color:C.muted}}>{inv.bookEntry?(inv.bookEntry.sgst?`₹${fmt(inv.bookEntry.sgst)}`:"—"):<span style={{color:C.red}}>N/A</span>}</td>
                                <td style={{padding:"5px 9px",textAlign:"right",fontWeight:700,color:td>0?C.amber:td<0?C.red:C.green}}>{td!==0?(td>0?"+":"")+"₹"+fmt(td):"—"}</td>
                              </tr>;
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </td></tr>}
                </React.Fragment>;
              })}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:8,fontSize:11,color:C.muted,textAlign:"right"}}>{filteredG.length} of {gstinReco.length} GSTINs · Click row to expand invoices</div>
        <BotNav/>
      </div>
    )}

    {/* ════════════════════ ③ RECO BY INVOICE ════════════════════ */}
    {tab==="invoice"&&(!canProceed
      ?<Empty msg="Please upload both files in Step ① first"/>
      :<div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}}>
          <div>
            <div style={{fontWeight:800,fontSize:19}}>Reconciliation by GST + Invoice Number</div>
            <div style={{color:C.muted,fontSize:13,marginTop:3}}>{pLabel} · {invReco.length} invoices matched</div>
          </div>
        </div>
        <div style={{display:"flex",gap:12,marginBottom:18,flexWrap:"wrap"}}>
          <StatCard label="Matched"      value={invCounts.MATCHED}      color={C.green} bg={C.greenBg} sub={`${Math.round(invCounts.MATCHED/(invReco.length||1)*100)}% match rate`}/>
          <StatCard label="Amt Mismatch" value={invCounts.AMT_MISMATCH} color={C.amber} bg={C.amberBg} sub="Tax amount differs"/>
          <StatCard label="In 2B Only"   value={invCounts.IN_2B_ONLY}   color={C.blue}  bg={C.blueBg}  sub="Not booked in Tally"/>
          <StatCard label="Books Only"   value={invCounts.IN_BOOKS_ONLY}color={C.red}   bg={C.redBg}   sub="Supplier yet to file"/>
          <StatCard label="2B Total ITC" value={fmtC(totalITC2b)}       color={C.teal}/>
          <StatCard label="Books Total"  value={fmtC(totalITCBooks)}    color={C.navy}
            sub={Math.abs(totalITC2b-totalITCBooks)>0.5?`Diff: ₹${fmt(Math.abs(totalITC2b-totalITCBooks))}`:"✓ Match"}/>
        </div>
        <FilterBar filter={filterI} setFilter={setFilterI} counts={invCounts} onExport={exportInvoice}/>
        <div style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12.5,minWidth:980}}>
            <thead><tr style={{background:"#f1f5f9"}}>
              {["Status","Supplier","GSTIN","Invoice No","Date","Taxable","IGST(2B)","CGST(2B)","SGST(2B)","IGST(Books)","CGST(Books)","SGST(Books)","Variance"].map(h=>(
                <th key={h} style={{padding:"8px 10px",textAlign:["Taxable","IGST(2B)","CGST(2B)","SGST(2B)","IGST(Books)","CGST(Books)","SGST(Books)","Variance"].includes(h)?"right":"left",
                  fontWeight:600,color:C.muted,whiteSpace:"nowrap",borderBottom:`1px solid ${C.border}`,fontSize:11.5}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {filteredI.length===0&&<tr><td colSpan={13} style={{textAlign:"center",padding:40,color:C.muted}}>No records</td></tr>}
              {filteredI.map((r,i)=>{
                const td=r.diff?r.diff.igst+r.diff.cgst+r.diff.sgst+r.diff.cess:0;
                return<tr key={i} style={{borderTop:`1px solid ${C.border}`,background:i%2===0?"#fff":C.stripe}}>
                  <td style={{padding:"7px 10px"}}><Badge status={r.status}/></td>
                  <td style={{padding:"7px 10px",fontWeight:500,maxWidth:150,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}} title={r.name}>{r.name}</td>
                  <td style={{padding:"7px 10px",fontFamily:"monospace",fontSize:10.5,color:C.muted}}>{r.gstin}</td>
                  <td style={{padding:"7px 10px",fontWeight:600,whiteSpace:"nowrap"}}>{r.invNo}</td>
                  <td style={{padding:"7px 10px",color:C.muted,whiteSpace:"nowrap"}}>{r.invDate}</td>
                  <td style={{padding:"7px 10px",textAlign:"right"}}>₹{fmt(r.taxable)}</td>
                  <td style={{padding:"7px 10px",textAlign:"right"}}>{r.igst?`₹${fmt(r.igst)}`:"—"}</td>
                  <td style={{padding:"7px 10px",textAlign:"right"}}>{r.cgst?`₹${fmt(r.cgst)}`:"—"}</td>
                  <td style={{padding:"7px 10px",textAlign:"right"}}>{r.sgst?`₹${fmt(r.sgst)}`:"—"}</td>
                  <td style={{padding:"7px 10px",textAlign:"right",color:C.muted}}>{r.bookEntry?(r.bookEntry.igst?`₹${fmt(r.bookEntry.igst)}`:"—"):<span style={{color:C.red}}>N/A</span>}</td>
                  <td style={{padding:"7px 10px",textAlign:"right",color:C.muted}}>{r.bookEntry?(r.bookEntry.cgst?`₹${fmt(r.bookEntry.cgst)}`:"—"):<span style={{color:C.red}}>N/A</span>}</td>
                  <td style={{padding:"7px 10px",textAlign:"right",color:C.muted}}>{r.bookEntry?(r.bookEntry.sgst?`₹${fmt(r.bookEntry.sgst)}`:"—"):<span style={{color:C.red}}>N/A</span>}</td>
                  <td style={{padding:"7px 10px",textAlign:"right",fontWeight:700,color:td>0?C.amber:td<0?C.red:C.green}}>{td!==0?(td>0?"+":"")+"₹"+fmt(td):"—"}</td>
                </tr>;
              })}
            </tbody>
          </table>
        </div>
        <div style={{marginTop:8,fontSize:11,color:C.muted,textAlign:"right"}}>Showing {filteredI.length} of {invReco.length} records</div>
        <BotNav/>
      </div>
    )}

    {/* ════════════════════ ④ 3B ITC CHECK ════════════════════ */}
    {tab==="3bcomp"&&(!data2bPeriod.length
      ?<Empty msg="Upload GSTR-2B data first"/>
      :<div>
        <div style={{marginBottom:16}}>
          <div style={{fontWeight:800,fontSize:19}}>3B ITC Verification</div>
          <div style={{color:C.muted,fontSize:13,marginTop:3}}>GSTR-2B available ITC vs GSTR-3B claimed · {pLabel}</div>
        </div>
        {itcComp.map(comp=>{
          const dc=comp.diff>500?C.red:comp.diff<-500?C.amber:C.green;
          const dl=comp.diff>500?"⚠ Over-claimed":comp.diff<-500?"⚠ Under-claimed":"✓ Matches";
          return<div key={comp.key} style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,marginBottom:12,overflow:"hidden"}}>
            <div style={{padding:"11px 16px",background:C.light,borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
              <div style={{fontWeight:700,fontSize:14}}>{comp.label}</div>
              <span style={{fontSize:12,fontWeight:700,padding:"3px 12px",borderRadius:99,background:comp.diff>500?C.redBg:comp.diff<-500?C.amberBg:C.greenBg,color:dc}}>
                {dl}{comp.diff!==0?" "+fmtC(comp.diff):""}
              </span>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
                <thead><tr style={{background:"#f1f5f9"}}>
                  <th style={{padding:"7px 14px",textAlign:"left",color:C.muted,fontWeight:600}}>Source</th>
                  {["IGST","CGST","SGST","CESS","Total ITC"].map(h=><th key={h} style={{padding:"7px 14px",textAlign:"right",color:C.muted,fontWeight:600}}>{h}</th>)}
                </tr></thead>
                <tbody>
                  <tr style={{borderTop:`1px solid ${C.border}`}}>
                    <td style={{padding:"9px 14px",fontWeight:600}}>GSTR-2B</td>
                    {["igst2b","cgst2b","sgst2b","cess2b","tot2b"].map(k=><td key={k} style={{padding:"9px 14px",textAlign:"right"}}>{comp[k]?fmtC(comp[k]):"—"}</td>)}
                  </tr>
                  <tr style={{borderTop:`1px solid ${C.border}`,background:C.light}}>
                    <td style={{padding:"9px 14px",fontWeight:600}}>GSTR-3B (Filed)</td>
                    {["igst3b","cgst3b","sgst3b","cess3b","tot3b"].map(k=><td key={k} style={{padding:"9px 14px",textAlign:"right",fontWeight:k==="tot3b"?700:400,color:k==="tot3b"?C.navy:"inherit"}}>{comp[k]?fmtC(comp[k]):"—"}</td>)}
                  </tr>
                  <tr style={{borderTop:`2px solid ${C.border}`,background:comp.diff>500?C.redBg:comp.diff<-500?C.amberBg:C.greenBg}}>
                    <td style={{padding:"9px 14px",fontWeight:700,color:dc}}>Variance (3B − 2B)</td>
                    {["igst","cgst","sgst","cess"].map(k=>{const v=(comp[k+"3b"]||0)-(comp[k+"2b"]||0);return<td key={k} style={{padding:"9px 14px",textAlign:"right",fontWeight:600,color:dc}}>{v!==0?"₹"+fmt(v):"—"}</td>;})}
                    <td style={{padding:"9px 14px",textAlign:"right",fontWeight:800,fontSize:15,color:dc}}>{comp.diff!==0?(comp.diff>0?"+":"")+fmtC(comp.diff):"✓ NIL"}</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>;
        })}
        {itcComp.length>0&&(()=>{
          const tot=itcComp.reduce((a,c)=>({tot2b:a.tot2b+c.tot2b,tot3b:a.tot3b+c.tot3b,diff:a.diff+c.diff}),{tot2b:0,tot3b:0,diff:0});
          const dc=tot.diff>500?C.red:tot.diff<-500?C.amber:C.green;
          return<div style={{padding:16,borderRadius:12,background:tot.diff>500?C.redBg:tot.diff<-500?C.amberBg:C.greenBg,border:`1.5px solid ${dc}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
            <div>
              <div style={{fontWeight:800,fontSize:15}}>{pLabel} — Total ITC Summary</div>
              <div style={{fontSize:13,marginTop:4,color:C.muted}}>2B Available: <strong>{fmtC(tot.tot2b)}</strong> &nbsp;|&nbsp; 3B Claimed: <strong>{fmtC(tot.tot3b)}</strong></div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:12,color:C.muted}}>Net Variance</div>
              <div style={{fontSize:22,fontWeight:800,color:dc}}>{tot.diff!==0?(tot.diff>0?"+":"")+fmtC(tot.diff):"✓ NIL"}</div>
            </div>
          </div>;
        })()}
        <BotNav/>
      </div>
    )}

    {/* ════════════════════ ⑤ SUMMARY REPORT ════════════════════ */}
    {tab==="report"&&(!canProceed
      ?<Empty msg="Upload data to generate the report"/>
      :<div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18,flexWrap:"wrap",gap:12}}>
          <div>
            <div style={{fontWeight:800,fontSize:19}}>Summary Report</div>
            <div style={{color:C.muted,fontSize:13,marginTop:3}}>{companyName} · {gstinNo} · {pLabel}</div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={exportGSTIN} style={{padding:"8px 14px",borderRadius:8,border:`1px solid ${C.teal}`,cursor:"pointer",background:"#fff",color:C.teal,fontFamily:"inherit",fontSize:12,fontWeight:700}}>↓ GSTIN CSV</button>
            <button onClick={exportInvoice} style={{padding:"8px 14px",borderRadius:8,border:"none",cursor:"pointer",background:C.teal,color:"#fff",fontFamily:"inherit",fontSize:12,fontWeight:700}}>↓ Invoice CSV</button>
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(320px,1fr))",gap:14,marginBottom:20}}>
          {[["📊 By GST Number",gstinCounts,gstinReco.length],["🧾 By Invoice",invCounts,invReco.length]].map(([title,counts,total])=>(
            <div key={title} style={{background:C.card,borderRadius:12,border:`1px solid ${C.border}`,overflow:"hidden"}}>
              <div style={{padding:"11px 16px",background:C.light,borderBottom:`1px solid ${C.border}`,fontWeight:700,fontSize:13}}>{title} ({total})</div>
              <div style={{padding:14,display:"flex",flexDirection:"column",gap:8}}>
                {Object.entries(ST).map(([k,s])=>(
                  <div key={k} style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 12px",borderRadius:7,background:s.bg}}>
                    <span style={{fontSize:12,fontWeight:600,color:s.color}}>{s.icon} {s.label}</span>
                    <span style={{fontSize:20,fontWeight:800,color:s.color}}>{counts[k]}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>

        {[
          {title:"🔵 In GSTR-2B but not in Books",status:"IN_2B_ONLY",action:"Verify with purchase team → Book in Tally → Claim ITC in next GSTR-3B"},
          {title:"🔴 In Books but not in GSTR-2B",status:"IN_BOOKS_ONLY",action:"Follow up with supplier to file GSTR-1 → Claim only after 2B reflection"},
          {title:"🟡 Amount Mismatches",status:"AMT_MISMATCH",action:"Reconcile with supplier → Obtain credit/debit note or revised invoice"},
        ].map(({title,status,action})=>{
          const items=invReco.filter(r=>r.status===status).sort((a,b)=>(b.igst+b.cgst+b.sgst+b.cess)-(a.igst+a.cgst+a.sgst+a.cess));
          if(!items.length) return null;
          const s=ST[status];
          return<div key={status} style={{background:C.card,borderRadius:12,border:`1.5px solid ${s.color}25`,marginBottom:12,overflow:"hidden"}}>
            <div style={{padding:"12px 16px",background:s.bg,borderBottom:`1px solid ${s.color}30`}}>
              <div style={{fontWeight:700,fontSize:13,color:s.color}}>{title} ({items.length})</div>
              <div style={{fontSize:11.5,fontWeight:600,color:s.color,marginTop:4}}>👉 {action}</div>
            </div>
            <div style={{overflowX:"auto"}}>
              <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                <thead><tr style={{background:C.light}}>
                  {["Supplier","GSTIN","Invoice No","Date","Total ITC"].map(h=>(
                    <th key={h} style={{padding:"6px 13px",textAlign:h==="Total ITC"?"right":"left",fontWeight:600,color:C.muted,borderBottom:`1px solid ${C.border}`}}>{h}</th>
                  ))}
                </tr></thead>
                <tbody>
                  {items.map((r,i)=><tr key={i} style={{borderTop:`1px solid ${C.border}`}}>
                    <td style={{padding:"6px 13px",fontWeight:500}}>{r.name}</td>
                    <td style={{padding:"6px 13px",fontFamily:"monospace",fontSize:11,color:C.muted}}>{r.gstin}</td>
                    <td style={{padding:"6px 13px",fontWeight:600}}>{r.invNo}</td>
                    <td style={{padding:"6px 13px",color:C.muted}}>{r.invDate}</td>
                    <td style={{padding:"6px 13px",textAlign:"right",fontWeight:700}}>{fmtC(r.igst+r.cgst+r.sgst+r.cess)}</td>
                  </tr>)}
                </tbody>
              </table>
            </div>
          </div>;
        })}
        <BotNav/>
      </div>
    )}

    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<GSTRecon/>);
</script>
</body>
</html>
